{% if page_data and page_data.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_data.has_prev %}
  <a href="?{% for k,v in filters.items() if k != 'page' %}{{ k }}={{ v }}&{% endfor %}page={{ page_data.prev_page }}">Previous</a>
  {% endif %}
  <span class="current">Page {{ page_data.page }} of {{ page_data.pages }}</span>
  {% if page_data.has_next %}
  <a href="?{% for k,v in filters.items() if k != 'page' %}{{ k }}={{ v }}&{% endfor %}page={{ page_data.next_page }}">Next</a>
  {% endif %}
</nav>
{% endif %}
