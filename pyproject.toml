[project]
name = "tradeedge-journal"
version = "1.0.0"
description = "Personal trading journal and analytics dashboard for XAU/USD and BTC/USD"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "psycopg[binary]==3.2.3",
    "bcrypt==4.2.1",
    "alembic==1.14.0",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]
mt5 = [
    "MetaTrader5==5.0.6090",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
